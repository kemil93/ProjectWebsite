<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>          
    <nav>
        <div class="BrandContainer">
            <a href="/">GameName</a>
            <ul>
                <li class="NavItem">Home</li>
            </ul>
        </div>
    </nav>
    <header>
            <h1>Dungeon Crawler Game</h1>
    </header>
    <hr>
    <!--Da H1 ad H6 sono Headings tag, i titoli-->
    <div class="main_container">
        <main>
            <h2>Register</h2>
            <form action="">
                <label for="NameBox">Name</label>
                <input id="NameBox" type="text" name="Name" placeholder="Name">
                <label for="SurnameBox">Surname</label>
                <input id="SurnameBox" type="text" name="Name" placeholder="Surname">
                <label for="UserNameBox">Username</label>
                <input id="UserNameBox" type="text" name="UserNameBox" placeholder="Username">
                <label for="EmailBox">Email</label>
                <input id="EmailBox" type="email" name="Email" placeholder="email@domain.com">
                <label for="PasswordBox">Password</label>
                <input id="PasswordBox" type="password" name="Password">
                <select name="Gender" id="Gender">
                    <option value="NA" selected>Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <p>
                    <label for="AcceptToS">Accept Terms and Conditions</label>
                    <input id="AcceptToS" type="checkbox">
                </p>
                <textarea name="Suggestions" id="Suggestions" placeholder="Notes"></textarea>
                <input type="submit">
            </form>
        </main>
        <aside>
            <ul>
                <li>
                    <a href="/about-the-game.html">About the Game</a>
                </li>
                <li>
                    <a href="/Enemies.html">Enemies</a>
                </li>
                <li>
                    <a href="/readme.md">To Do List</a>
                </li>
            </ul>
        </aside>
    </div>
    </div>
    <footer>
            <h5><a href="/about-us.html">About Us</a></h5>
    </footer>
</body>
</html>
